name: cobramod-dev
channels:
  - conda-forge
dependencies:
  - python=3.14
  - pip=26.2.2
  # cobramod and its dependencies
  - colorlog=6.12.0
  - cobra=0.32.1
  - requests=2.34.2
  - tqdm=4.70.1
  - openpyxl=3.1.5
  - webcolors=25.10.0
  - pyarrow=26.0.1
  - anywidget=0.11.0
  - platformdirs=4.14.5

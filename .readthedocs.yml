version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "miniforge3-26.3"
    nodejs: "latest"
  jobs:
      pre_create_environment:
        - npm install --global yarn
        - yarn install
        - yarn run vite build

sphinx:
  configuration: docs/source/conf.py

conda:
  environment: environment.yml

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - escher
